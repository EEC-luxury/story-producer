<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Story Producer AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:         #0d0d10;
      --surface:    #16161c;
      --surface2:   #1e1e26;
      --border:     #2a2a36;
      --accent:     #7c6ef7;
      --accent-dim: #3d3680;
      --user-bg:    #1a3a5c;
      --ai-bg:      #1e1e26;
      --text:       #e4e4f0;
      --muted:      #8888a0;
      --green:      #22c55e;
      --red:        #ef4444;
      --radius:     12px;
      --sidebar-w:  260px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.3s ease, transform 0.3s ease;
      z-index: 100;
      overflow: hidden;
    }
    #sidebar.collapsed {
      width: 0;
      overflow: hidden;
      border-right: none;
    }
    .sidebar-header {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sidebar-title {
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #7c6ef7, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #newChatBtn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    #newChatBtn:hover { background: #6b5de0; }

    #chatList {
      flex: 1;
      overflow-y: auto;
      padding: 8px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #chatList::-webkit-scrollbar { width: 3px; }
    #chatList::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      gap: 6px;
    }
    .chat-item:hover { background: var(--surface2); }
    .chat-item.active { background: var(--accent-dim); }
    .chat-item-title {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .chat-item.active .chat-item-title { color: #c4b5fd; }
    .chat-item-date {
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 14px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }
    .chat-item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { color: var(--red); }

    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
    }
    #settingsBtn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      width: 100%;
      text-align: left;
      transition: color 0.2s, border-color 0.2s;
    }
    #settingsBtn:hover { color: var(--text); border-color: var(--accent); }

    /* ── Main Area ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #toggleSidebar {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      font-size: 18px;
      line-height: 1;
      transition: color 0.2s;
      flex-shrink: 0;
    }
    #toggleSidebar:hover { color: var(--text); }
    #chatTitle {
      font-family: 'Sora', sans-serif;
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #7c6ef7, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #syncStatus {
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ── Setup Panel ── */
    #setupPanel {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
      overflow: hidden;
      max-height: 230px;
      transition: max-height 0.35s ease, padding 0.35s ease, opacity 0.3s;
    }
    #setupPanel.hidden {
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      opacity: 0;
      pointer-events: none;
    }
    .setup-row { display: flex; gap: 8px; align-items: center; }
    .setup-label {
      font-size: 11px;
      color: var(--muted);
      min-width: 54px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .key-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    .key-input:focus { border-color: var(--accent); }
    #saveBtn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      align-self: flex-end;
      transition: background 0.2s;
    }
    #saveBtn:hover { background: #6b5de0; }
    #setupNote { font-size: 11px; color: var(--muted); line-height: 1.6; }
    #setupNote a { color: var(--accent); text-decoration: none; }

    /* ── Chat Box ── */
    #chatBox {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    #chatBox::-webkit-scrollbar { width: 4px; }
    #chatBox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg-wrap { display: flex; flex-direction: column; gap: 4px; }
    .msg-wrap.user { align-items: flex-end; }
    .msg-wrap.ai   { align-items: flex-start; }
    .msg-label {
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 0 4px;
    }
    .msg {
      padding: 11px 15px;
      border-radius: var(--radius);
      max-width: 84%;
      line-height: 1.55;
      font-size: 14px;
      word-break: break-word;
    }
    .msg.user {
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
      color: #c8e0ff;
    }
    .msg.ai {
      background: var(--ai-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      white-space: pre-wrap;
    }
    .msg.status {
      background: transparent;
      border: 1px dashed var(--accent-dim);
      color: var(--accent);
      font-size: 13px;
      max-width: 100%;
      border-radius: 8px;
    }
    .msg.error {
      background: transparent;
      border: 1px dashed #6b1f1f;
      color: var(--red);
      font-size: 13px;
      max-width: 100%;
      border-radius: 8px;
    }

    /* ── Empty State ── */
    #emptyState {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      color: var(--muted);
      text-align: center;
      padding: 40px 20px;
    }
    #emptyState.show { display: flex; }
    #emptyState .icon { font-size: 48px; opacity: 0.4; }
    #emptyState p { font-size: 14px; line-height: 1.6; max-width: 260px; }

    /* ── Typing Indicator ── */
    #typingIndicator {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 10px 15px;
      background: var(--ai-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      width: fit-content;
    }
    #typingIndicator span {
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
      display: block;
    }
    #typingIndicator span:nth-child(2) { animation-delay: 0.2s; }
    #typingIndicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%            { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Audio Player ── */
    #audioSection {
      display: none;
      margin: 0 16px 4px;
      background: var(--surface2);
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius);
      padding: 12px 14px;
      flex-shrink: 0;
    }
    .audio-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .audio-title { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; }
    #downloadLink {
      display: none;
      font-size: 12px;
      font-weight: 600;
      color: var(--green);
      text-decoration: none;
      background: rgba(34,197,94,0.1);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(34,197,94,0.25);
    }
    audio { width: 100%; height: 34px; border-radius: 6px; accent-color: var(--accent); }

    /* ── Input Bar ── */
    #inputBar {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 16px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    #userInput {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      resize: none;
      min-height: 42px;
      max-height: 130px;
      line-height: 1.5;
      transition: border-color 0.2s;
      outline: none;
    }
    #userInput:focus { border-color: var(--accent); }
    #userInput::placeholder { color: var(--muted); }
    #sendBtn {
      background: var(--accent);
      border: none;
      color: white;
      width: 42px; height: 42px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }
    #sendBtn:hover { background: #6b5de0; }
    #sendBtn:active { transform: scale(0.94); }
    #sendBtn:disabled { background: var(--accent-dim); cursor: not-allowed; }
    #sendBtn svg { width: 18px; height: 18px; fill: white; }

    /* ── Overlay for mobile sidebar ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
    }
    #overlay.show { display: block; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      #sidebar {
        position: absolute;
        height: 100%;
        transform: translateX(calc(-1 * var(--sidebar-w)));
      }
      #sidebar.open {
        transform: translateX(0);
      }
    }
    @media (min-width: 601px) {
      #overlay { display: none !important; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">🎬 Story Producer</span>
    <button id="newChatBtn" onclick="createNewChat()">
      <span>＋</span> New Story
    </button>
  </div>
  <div id="chatList">
    <div style="text-align:center; color:var(--muted); font-size:12px; padding:20px 10px;">
      Loading chats…
    </div>
  </div>
  <div class="sidebar-footer">
    <button id="settingsBtn" onclick="toggleSetup()">⚙️ API Keys</button>
  </div>
</div>

<!-- Mobile overlay -->
<div id="overlay" onclick="closeSidebar()"></div>

<!-- Main -->
<div id="main">

  <!-- Header -->
  <header>
    <button id="toggleSidebar" onclick="toggleSidebar()" title="Toggle sidebar">☰</button>
    <span id="chatTitle">🎬 Story Producer AI</span>
    <span id="syncStatus"></span>
  </header>

  <!-- Setup Panel -->
  <div id="setupPanel" class="hidden">
    <div class="setup-row">
      <span class="setup-label">Gemini</span>
      <input class="key-input" type="password" id="geminiKey" placeholder="Paste your Gemini API key" autocomplete="off"/>
    </div>
    <div class="setup-row">
      <span class="setup-label">11Labs</span>
      <input class="key-input" type="password" id="elevenKey" placeholder="Paste your ElevenLabs API key (optional)" autocomplete="off"/>
    </div>
    <p id="setupNote">
      Gemini key → <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com</a><br/>
      ElevenLabs → <a href="https://elevenlabs.io/app/settings/api-keys" target="_blank">elevenlabs.io</a><br/>
      Keys saved in your browser only.
    </p>
    <button id="saveBtn" onclick="saveKeys()">Save Keys</button>
  </div>

  <!-- Chat Box -->
  <div id="chatBox">
    <div id="emptyState" class="show">
      <div class="icon">🎬</div>
      <p>Select a story from the sidebar or start a new one to begin crafting your video.</p>
    </div>
    <div id="typingIndicator"><span></span><span></span><span></span></div>
  </div>

  <!-- Audio -->
  <div id="audioSection">
    <div class="audio-header">
      <span class="audio-title">🎧 Voiceover Ready</span>
      <a id="downloadLink" href="#" download="voiceover.mp3">⬇ Download MP3</a>
    </div>
    <audio id="audioPlayback" controls></audio>
  </div>

  <!-- Input -->
  <div id="inputBar">
    <textarea id="userInput" placeholder="Describe your story idea… (Enter to send, Shift+Enter for new line)" rows="1"></textarea>
    <button id="sendBtn" onclick="sendMessage()" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
  // ── Firebase Config (from your StoryTwist project) ──
  const FB_CONFIG = {
    apiKey:      'AIzaSyBG2_ngbLQ216jrvEmGgnkR7Yege5Vwa38',
    authDomain:  'story-twist-ai.firebaseapp.com',
    projectId:   'story-twist-ai',
    databaseURL: 'https://story-twist-ai-default-rtdb.firebaseio.com'
  };

  // ── API Endpoints (proxied through Vercel) ──
  const API_CHAT      = '/api/chat';
  const API_VOICEOVER = '/api/voiceover';

  const SYSTEM_INSTRUCTION = `You are an expert AI Storytelling Partner and Video Producer. Your job is to collaborate interactively with the user to design a story video.

STRICT RULES:
1. INTERACTIVE PHASE: Chat naturally. Ask smart clarifying questions about plot, characters, mood, and pacing. DO NOT generate the final asset breakdown yet.
2. AGREEMENT GATE: Only move to generation after the user explicitly agrees with phrases like: "I agree", "Approved", "Let's generate", "Proceed", "Start creating".
3. GENERATION PHASE: Once agreed, produce a full breakdown:
   - Number each scene clearly
   - Break each scene into multiple FRAMES (minimum 2-4 frames per scene)
   - For every frame:
     [Frame X Image Prompt]: Rich, cinematic image generation prompt (lighting, camera angle, color tone, art style)
     [Voiceover Text]: Exact words spoken during this frame
4. TRIGGER: End your generation response with exactly:
### TRIGGER_VOICEOVER ###
Then write ONLY the compiled voiceover lines — no labels, no frame numbers, clean continuous narration.`;

  // ── State ──
  let db            = null;
  let currentChatId = null;
  let chatHistory   = [];
  let allChats      = {};
  let isSending     = false;
  let currentAudioUrl = null;

  // ── Init ──
  window.addEventListener('load', () => {
    // Load keys
    document.getElementById('geminiKey').value = localStorage.getItem('gemini_key') || '';
    document.getElementById('elevenKey').value = localStorage.getItem('eleven_key') || '';

    // Show setup if no Gemini key
    if (!localStorage.getItem('gemini_key')) {
      document.getElementById('setupPanel').classList.remove('hidden');
    }

    // Auto-grow textarea
    const ta = document.getElementById('userInput');
    ta.addEventListener('input', () => {
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 130) + 'px';
    });
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!isSending) sendMessage();
      }
    });

    // Init Firebase
    try {
      firebase.initializeApp(FB_CONFIG);
      db = firebase.database();
      setSyncStatus('🔄 Connecting…');
      listenToChats();
    } catch (e) {
      setSyncStatus('⚠️ Offline');
      renderChatList({});
    }

    // Sidebar default state
    if (window.innerWidth > 600) {
      document.getElementById('sidebar').classList.remove('hidden');
    }
  });

  // ── Firebase: Listen to all chats ──
  function listenToChats() {
    db.ref('chats').orderByChild('updatedAt').on('value', (snap) => {
      allChats = {};
      if (snap.exists()) {
        snap.forEach(child => { allChats[child.key] = child.val(); });
      }
      renderChatList(allChats);
      setSyncStatus('☁️ Synced');
    }, () => {
      setSyncStatus('⚠️ Sync error');
    });
  }

  // ── Render Sidebar Chat List ──
  function renderChatList(chats) {
    const list = document.getElementById('chatList');
    const keys = Object.keys(chats).sort((a, b) =>
      (chats[b].updatedAt || 0) - (chats[a].updatedAt || 0)
    );

    if (keys.length === 0) {
      list.innerHTML = `<div style="text-align:center;color:var(--muted);font-size:12px;padding:20px 10px">
        No stories yet.<br/>Click <strong>New Story</strong> to begin.
      </div>`;
      return;
    }

    list.innerHTML = '';
    keys.forEach(id => {
      const chat = chats[id];
      const div  = document.createElement('div');
      div.className = 'chat-item' + (id === currentChatId ? ' active' : '');
      div.dataset.id = id;

      const date = chat.updatedAt
        ? new Date(chat.updatedAt).toLocaleDateString([], { month:'short', day:'numeric' })
        : '';

      div.innerHTML = `
        <span class="chat-item-title">${escHtml(chat.title || 'New Story')}</span>
        <span class="chat-item-date">${date}</span>
        <button class="delete-btn" title="Delete" onclick="deleteChat(event,'${id}')">🗑</button>
      `;
      div.addEventListener('click', (e) => {
        if (e.target.classList.contains('delete-btn')) return;
        loadChat(id);
        if (window.innerWidth <= 600) closeSidebar();
      });
      list.appendChild(div);
    });
  }

  // ── Create New Chat ──
  function createNewChat() {
    const id  = 'chat_' + Date.now();
    const now = Date.now();

    const newChat = {
      title:     'New Story',
      messages:  [],
      history:   [],
      createdAt: now,
      updatedAt: now
    };

    if (db) db.ref('chats/' + id).set(newChat).catch(() => {});

    allChats[id]  = newChat;
    currentChatId = id;
    chatHistory   = [];

    renderChatList(allChats);
    clearChatUI();
    showEmptyState(false);
    showWelcomeMessage();
    updateChatTitle('New Story');

    if (window.innerWidth <= 600) closeSidebar();
    document.getElementById('userInput').focus();
  }

  // ── Load Chat ──
  function loadChat(id) {
    currentChatId = id;
    const chat    = allChats[id];
    chatHistory   = chat.history || [];

    clearChatUI();
    showEmptyState(false);
    updateChatTitle(chat.title || 'New Story');

    // Re-render saved messages
    const messages = chat.messages || [];
    if (messages.length === 0) {
      showWelcomeMessage();
    } else {
      messages.forEach(m => appendMsg(m.text, m.role, false));
    }

    // Update active state in sidebar
    document.querySelectorAll('.chat-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === id);
    });

    document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
  }

  // ── Delete Chat ──
  function deleteChat(e, id) {
    e.stopPropagation();
    if (!confirm('Delete this story? This cannot be undone.')) return;

    if (db) db.ref('chats/' + id).remove();
    delete allChats[id];

    if (currentChatId === id) {
      currentChatId = null;
      chatHistory   = [];
      clearChatUI();
      showEmptyState(true);
      updateChatTitle('🎬 Story Producer AI');
      document.getElementById('audioSection').style.display = 'none';
    }
    renderChatList(allChats);
  }

  // ── Persist current chat to Firebase ──
  function persistChat(newUserMsg, newAiMsg) {
    if (!currentChatId) return;
    const chat = allChats[currentChatId] || {};

    // Append new messages — cap at 100 to stay within Firebase limits
    const messages = [...(chat.messages || [])];
    if (newUserMsg) messages.push({ role: 'user', text: newUserMsg });
    if (newAiMsg)   messages.push({ role: 'ai',   text: newAiMsg });
    const cappedMessages = messages.slice(-100);

    // Auto-title from first user message
    let title = chat.title || 'New Story';
    if (title === 'New Story' && newUserMsg) {
      title = newUserMsg.slice(0, 40) + (newUserMsg.length > 40 ? '…' : '');
    }

    const updated = {
      ...chat,
      title,
      messages:  cappedMessages,
      history:   chatHistory,
      updatedAt: Date.now()
    };

    allChats[currentChatId] = updated;
    updateChatTitle(title);

    if (db) db.ref('chats/' + currentChatId).set(updated).catch(() => {});
    renderChatList(allChats);
  }

  // ── Send Message ──
  async function sendMessage() {
    if (isSending) return;
    const ta   = document.getElementById('userInput');
    const text = ta.value.trim();
    if (!text) return;

    const gKey = localStorage.getItem('gemini_key');
    if (!gKey) {
      document.getElementById('setupPanel').classList.remove('hidden');
      appendError('Add your Gemini API key first.');
      return;
    }

    // Auto-create chat if none selected
    if (!currentChatId) createNewChat();

    appendMsg(text, 'user');
    ta.value = '';
    ta.style.height = 'auto';

    isSending = true;
    document.getElementById('sendBtn').disabled = true;
    showTyping(true);

    chatHistory.push({ role: 'user', parts: [{ text }] });
    if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);

    try {
      const res = await fetch(API_CHAT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-gemini-key': gKey },
        body: JSON.stringify({ history: chatHistory, systemInstruction: SYSTEM_INSTRUCTION }),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Server error ${res.status}`);

      const aiText = data.text;
      chatHistory.push({ role: 'model', parts: [{ text: aiText }] });
      showTyping(false);

      if (aiText.includes('### TRIGGER_VOICEOVER ###')) {
        const [breakdown, script] = aiText.split('### TRIGGER_VOICEOVER ###');
        const cleanBreakdown = breakdown.trim();
        appendMsg(cleanBreakdown, 'ai');
        persistChat(text, cleanBreakdown);

        const eKey = localStorage.getItem('eleven_key');
        if (eKey) {
          appendStatus('⚡ Story approved! Generating voiceover…');
          await generateVoiceover(script.trim(), eKey);
        } else {
          appendStatus('⚠️ No ElevenLabs key. Add it via ⚙️ API Keys for audio.');
          const scriptMsg = '📝 Voiceover script:\n\n' + script.trim();
          appendMsg(scriptMsg, 'ai');
          persistChat(null, scriptMsg);
        }
      } else {
        appendMsg(aiText, 'ai');
        persistChat(text, aiText);
      }

    } catch (err) {
      showTyping(false);
      appendError('Gemini error: ' + err.message);
    } finally {
      isSending = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('userInput').focus();
    }
  }

  // ── Voiceover ──
  async function generateVoiceover(scriptText, eKey) {
    try {
      if (currentAudioUrl) { URL.revokeObjectURL(currentAudioUrl); currentAudioUrl = null; }

      const res = await fetch(API_VOICEOVER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-elevenlabs-key': eKey },
        body: JSON.stringify({ text: scriptText }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        throw new Error(err.error || `Status ${res.status}`);
      }

      const blob = await res.blob();
      currentAudioUrl = URL.createObjectURL(blob);

      const player = document.getElementById('audioPlayback');
      const dlLink = document.getElementById('downloadLink');
      player.src    = currentAudioUrl;
      dlLink.href   = currentAudioUrl;
      dlLink.style.display = 'inline-block';
      document.getElementById('audioSection').style.display = 'block';
      document.getElementById('audioSection').scrollIntoView({ behavior:'smooth', block:'nearest' });
      player.play().catch(() => {});

    } catch (err) {
      appendError('Voiceover error: ' + err.message);
    }
  }

  // ── UI Helpers ──
  function appendMsg(text, role, scroll = true) {
    const box    = document.getElementById('chatBox');
    const typing = document.getElementById('typingIndicator');

    const wrap   = document.createElement('div');
    wrap.className = `msg-wrap ${role}`;

    const label  = document.createElement('span');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'You' : 'Story AI';

    const bubble = document.createElement('div');
    bubble.className = `msg ${role}`;
    bubble.textContent = text;

    wrap.appendChild(label);
    wrap.appendChild(bubble);
    box.insertBefore(wrap, typing);
    if (scroll) box.scrollTop = box.scrollHeight;
  }

  function appendStatus(text) {
    const box    = document.getElementById('chatBox');
    const typing = document.getElementById('typingIndicator');
    const div    = document.createElement('div');
    div.className = 'msg status';
    div.textContent = text;
    box.insertBefore(div, typing);
    box.scrollTop = box.scrollHeight;
  }

  function appendError(text) {
    const box    = document.getElementById('chatBox');
    const typing = document.getElementById('typingIndicator');
    const div    = document.createElement('div');
    div.className = 'msg error';
    div.textContent = '❌ ' + text;
    box.insertBefore(div, typing);
    box.scrollTop = box.scrollHeight;
  }

  function showTyping(visible) {
    const el = document.getElementById('typingIndicator');
    el.style.display = visible ? 'flex' : 'none';
    if (visible) document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
  }

  function showWelcomeMessage() {
    appendMsg(`Hey! I'm your AI Story Producer. Tell me your story idea — even just a rough concept — and we'll shape it together into a full video script with frame-by-frame image prompts and a voiceover.\n\nOnce we've both agreed on the layout, I'll generate the audio automatically.\n\nWhat's your story about?`, 'ai', false);
  }

  function clearChatUI() {
    const box = document.getElementById('chatBox');
    // Remove everything except the permanent elements
    Array.from(box.children).forEach(child => {
      if (child.id !== 'typingIndicator' && child.id !== 'emptyState') {
        child.remove();
      }
    });
    // Hide audio section when switching chats
    document.getElementById('audioSection').style.display = 'none';
    // Revoke any lingering audio blob
    if (currentAudioUrl) { URL.revokeObjectURL(currentAudioUrl); currentAudioUrl = null; }
  }

  function showEmptyState(show) {
    document.getElementById('emptyState').classList.toggle('show', show);
  }

  function updateChatTitle(title) {
    document.getElementById('chatTitle').textContent = title;
  }

  function setSyncStatus(text) {
    document.getElementById('syncStatus').textContent = text;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Setup ──
  function toggleSetup() {
    document.getElementById('setupPanel').classList.toggle('hidden');
  }

  function saveKeys() {
    const gKey = document.getElementById('geminiKey').value.trim();
    const eKey = document.getElementById('elevenKey').value.trim();
    if (!gKey) { alert('Gemini key is required.'); return; }
    localStorage.setItem('gemini_key', gKey);
    localStorage.setItem('eleven_key', eKey);
    document.getElementById('setupPanel').classList.add('hidden');
    appendStatus('✅ Keys saved.');
  }

  // ── Sidebar ──
  function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    if (window.innerWidth <= 600) {
      // Mobile: slide in/out as overlay
      sb.classList.toggle('open');
      document.getElementById('overlay').classList.toggle('show', sb.classList.contains('open'));
    } else {
      // Desktop: collapse width so main area fills space
      sb.classList.toggle('collapsed');
    }
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  }
</script>
</body>
</html>
